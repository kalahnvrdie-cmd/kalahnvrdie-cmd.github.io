<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Message</title>
  <style>
    body {
      background: #0d0f14;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #161a24;
      border: 1px solid #262c3d;
      border-radius: 14px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    button {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
    }
    button:hover {
      background: #dc2626;
    }
    #secretBox {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #0d0f14;
      border-left: 3px solid #38bdf8;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Secret Message</h2>
    <p id="statusText">පණිවිඩය බැලීමට පහළ button එක ඔබන්න.</p>
    <button id="revealBtn" type="button">Secret Message එක බලන්න</button>

    <div id="secretBox">
      <strong>රහස් පණිවිඩය:</strong>
      <p id="secretContent">මෙතන ඔයාගේ රහස් මැසේජ් එක දාන්න.</p>
    </div>
  </div>

  <script>
    const WEB3FORMS_ACCESS_KEY = "6071ee91-2983-4a77-b742-af964ed176b6";

    async function sendNotify(eventName, extraInfo = "") {
      if (!WEB3FORMS_ACCESS_KEY) {
        console.warn("Web3Forms Access Key එක දාලා නැහැ.");
        return;
      }

      const payload = {
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: `Alert: ${eventName}`,
        from_name: "Secret Message Logger",
        event: eventName,
        details: extraInfo,
        page_url: window.location.href,
        referrer: document.referrer || "Direct / None",
        user_agent: navigator.userAgent,
        timestamp: new Date().toISOString()
      };

      try {
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.success) {
          console.log("Email sent:", eventName);
        } else {
          console.error("Web3Forms response error:", data);
        }
      } catch (err) {
        console.error("Network/Fetch error:", err);
      }
    }

    // 1. Site එක open වෙනකොට notify
    window.addEventListener("DOMContentLoaded", () => {
      sendNotify("Site Opened", "කෙනෙක් site එක open කළා.");
    });

    // 2. Secret message එක බලනකොට notify
    const revealBtn = document.getElementById("revealBtn");
    const secretBox = document.getElementById("secretBox");
    const statusText = document.getElementById("statusText");

    revealBtn.addEventListener("click", async () => {
      secretBox.style.display = "block";
      statusText.textContent = "පණිවිඩය විවෘත කරන ලදී.";
      await sendNotify("Secret Message Viewed", "කෙනෙක් secret message button එක click කරලා මැසේජ් එක බැලුවා.");
    });
  </script>
</body>
</html>
