<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAH // ENCRYPTED TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            color: #ff1e42;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at center, #1a0005 0%, #050505 100%);
        }
        .terminal-box {
            width: 100%;
            max-width: 480px;
            background-color: #0a0a0a;
            border: 2px solid #ff1e42;
            box-shadow: 0 0 25px rgba(255, 30, 66, 0.35);
            border-radius: 8px;
            padding: 20px;
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #ff1e42;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff1e42;
        }
        .header p {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ff4d6d;
        }
        textarea, input {
            width: 100%;
            background-color: #111;
            color: #fff;
            border: 1px solid #ff1e42;
            border-radius: 5px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 15px;
            outline: none;
        }
        textarea:focus, input:focus {
            box-shadow: 0 0 10px rgba(255, 30, 66, 0.6);
            border-color: #fff;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-encrypt {
            background-color: #ff1e42;
            color: #050505;
            border: none;
        }
        .btn-encrypt:active {
            background-color: #fff;
        }
        .btn-decrypt {
            background-color: transparent;
            color: #ff1e42;
            border: 1px solid #ff1e42;
        }
        .btn-decrypt:active {
            background-color: #ff1e42;
            color: #050505;
        }
        .btn-wa {
            background-color: #128c7e;
            color: #fff;
            border: none;
        }
        .btn-copy {
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
        }
        #msgBox {
            text-align: center;
            font-size: 0.85rem;
            min-height: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="terminal-box">
    <div class="header">
        <h1>[ KALAH // SYSTEM ]</h1>
        <p>ENCRYPTED. DO NOT DISTURB. 🔒</p>
    </div>

    <label>&gt; ENTER SECRET MESSAGE OR CODE:</label>
    <textarea id="inputArea" rows="4" placeholder="Type message to lock, or paste code to unlock..."></textarea>

    <label>&gt; SECRET KEY (PASSWORD):</label>
    <input type="password" id="passKey" placeholder="Enter secret key...">

    <div class="btn-row">
        <button class="btn-encrypt" onclick="runCipher('lock')">🔒 LOCK (ENCRYPT)</button>
        <button class="btn-decrypt" onclick="runCipher('unlock')">🔓 UNLOCK (DECRYPT)</button>
    </div>

    <div id="msgBox"></div>

    <label>&gt; TERMINAL OUTPUT:</label>
    <textarea id="outputArea" rows="4" readonly placeholder="Encrypted/Decrypted result will appear here..."></textarea>

    <div class="btn-row">
        <button class="btn-copy" onclick="copyText()">📋 COPY</button>
        <button class="btn-wa" onclick="shareWA()">📲 SEND WHATSAPP</button>
    </div>

    <div class="footer">SYSTEM SECURED BY KALAH PROTOCOL</div>
</div>

<script>
    function notify(text, isErr) {
        const box = document.getElementById('msgBox');
        box.style.color = isErr ? '#ff3333' : '#00ff66';
        box.innerText = text;
        setTimeout(() => { box.innerText = ''; }, 3500);
    }

    function cipherEngine(str, key) {
        let out = '';
        for (let i = 0; i < str.length; i++) {
            out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return out;
    }

    function runCipher(action) {
        const input = document.getElementById('inputArea').value.trim();
        const key = document.getElementById('passKey').value;
        const output = document.getElementById('outputArea');

        if (!input) {
            notify('! TYPE SOMETHING FIRST', true);
            return;
        }
        if (!key) {
            notify('! ENTER SECRET KEY', true);
            return;
        }

        try {
            if (action === 'lock') {
                const encodedUri = encodeURIComponent(input);
                const xored = cipherEngine(encodedUri, key);
                const base64 = btoa(xored);
                output.value = base64;
                notify('✓ MESSAGE LOCKED & READY', false);
            } else {
                const rawBase64 = atob(input);
                const unxored = cipherEngine(rawBase64, key);
                const decodedUri = decodeURIComponent(unxored);
                output.value = decodedUri;
                notify('✓ MESSAGE UNLOCKED', false);
            }
        } catch (err) {
            output.value = '';
            notify('! WRONG KEY OR INVALID CODE', true);
        }
    }

    function copyText() {
        const out = document.getElementById('outputArea');
        if (!out.value) {
            notify('! NOTHING TO COPY', true);
            return;
        }
        out.select();
        out.setSelectionRange(0, 99999);
        if (navigator.clipboard) {
            navigator.clipboard.writeText(out.value);
        } else {
            document.execCommand('copy');
        }
        notify('✓ COPIED TO CLIPBOARD', false);
    }

    function shareWA() {
        const out = document.getElementById('outputArea').value;
        if (!out) {
            notify('! LOCK A MESSAGE FIRST', true);
            return;
        }
        const siteUrl = window.location.href;
        const fullMsg = "🔒 *ENCRYPTED MESSAGE (KALAH)*\n\n" + out + "\n\n🔓 Unlock here: " + siteUrl;
        const waLink = "https://wa.me" + encodeURIComponent(fullMsg);
        window.location.href = waLink;
    }
</script>

</body>
</html>
