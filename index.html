<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAH // ENCRYPTED</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ff1e42;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.25;
        }
        .terminal {
            width: 100%;
            max-width: 600px;
            border: 1px solid #ff1e42;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 30, 66, 0.4);
            background-color: rgba(10, 10, 10, 0.92);
            border-radius: 5px;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 3px;
            border-bottom: 1px dashed #ff1e42;
            padding-bottom: 10px;
            margin-top: 0;
            animation: glitch 2.5s infinite;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); text-shadow: none; }
            92% { transform: translate(-2px, 1px); text-shadow: 2px 0 #00ffea; }
            94% { transform: translate(2px, -1px); text-shadow: -2px 0 #ff1e42; }
            96% { transform: translate(-1px, 2px); }
        }
        p {
            color: #d4d4d4;
            line-height: 1.6;
            font-size: 14px;
            margin: 10px 0;
        }
        .highlight {
            color: #ff1e42;
            font-weight: bold;
        }
        .cmd-box {
            margin-top: 20px;
            border-top: 1px dashed #444;
            padding-top: 15px;
        }
        .cmd-input-line {
            display: flex;
            align-items: center;
            color: #ff1e42;
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            width: 100%;
            margin-left: 8px;
            outline: none;
        }
        #cmd-output {
            color: #00ff88;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
        .btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px 20px;
            border: 1px solid #ff1e42;
            color: #ff1e42;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
            background: rgba(255, 30, 66, 0.05);
        }
        .btn:hover {
            background-color: #ff1e42;
            color: #050505;
            box-shadow: 0 0 15px #ff1e42;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="terminal">
        <h1>> SYSTEM: KALAH_</h1>
        <p><span class="highlight">[STATUS]:</span> ENCRYPTED // DO NOT DISTURB</p>
        <p id="typing-text"></p>
        <p><span class="highlight">[ACCESS]:</span> Restricted Zone. Level 5 Security.</p>

        <div class="cmd-box">
            <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Type 'help', 'about', or 'secret' and press Enter:</div>
            <div class="cmd-input-line">
                <span>guest@kalah:~$</span>
                <input type="text" id="cmd-input" placeholder="enter command..." autocomplete="off">
            </div>
            <div id="cmd-output"></div>
        </div>

        <a href="https://whatsapp.com." class="btn">> INITIATE SECURE CHAT</a>
    </div>

    <script>
        // Typing Animation
        const text = "[MESSAGE]: Every shadow hides a story. Read between the lines. Silence is my loudest weapon.";
        let idx = 0;
        function typeWriter() {
            if (idx < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(idx);
                idx++;
                setTimeout(typeWriter, 35);
            }
        }
        window.onload = typeWriter;

        // Interactive Terminal Commands
        const input = document.getElementById("cmd-input");
        const output = document.getElementById("cmd-output");
        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                const val = input.value.trim().toLowerCase();
                if (val === "help") {
                    output.innerHTML = "> Available commands: [about] [secret] [clear]";
                } else if (val === "about") {
                    output.innerHTML = "> KALAH: Observer of shadows. Architect of silence.";
                } else if (val === "secret") {
                    output.innerHTML = "> ACCESS GRANTED: Look closer into the dark. Not everything is as it seems.";
                } else if (val === "clear") {
                    output.innerHTML = "";
                } else {
                    output.innerHTML = "> Error: Command '" + val + "' not recognized. Type 'help'.";
                }
                input.value = "";
            }
        });

        // Matrix Rain Effect
        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
        const letters = "KALAH010101XYZ";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff1e42";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 45);
    </script>
</body>
</html>
