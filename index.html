<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALAH // SYSTEM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#ff1e42;font-family:monospace;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.box{width:100%;max-width:460px;background:#0a0a0a;border:2px solid #ff1e42;box-shadow:0 0 20px rgba(255,30,66,.4);border-radius:8px;padding:18px;position:relative}
.hdr{text-align:center;border-bottom:1px dashed #ff1e42;padding-bottom:12px;margin-bottom:12px}
.hdr h1{font-size:1.4rem;letter-spacing:2px;text-shadow:0 0 8px #ff1e42}
.hdr p{font-size:.75rem;color:#999;margin-top:4px}
.bar{display:flex;justify-content:space-between;background:#140508;border:1px solid #4d000f;padding:6px 10px;border-radius:4px;font-size:.75rem;margin-bottom:12px}
label{display:block;font-size:.8rem;font-weight:bold;margin-bottom:5px;color:#ff4d6d}
textarea,input{width:100%;background:#111;color:#fff;border:1px solid #ff1e42;border-radius:5px;padding:10px;font-family:inherit;font-size:.95rem;margin-bottom:12px;outline:none}
.row{display:flex;gap:10px;margin-bottom:12px}
button{flex:1;padding:11px;font-family:inherit;font-weight:bold;font-size:.85rem;border-radius:5px;cursor:pointer;text-transform:uppercase}
.enc{background:#ff1e42;color:#050505;border:none}
.dec{background:transparent;color:#ff1e42;border:1px solid #ff1e42}
.wa{background:#128c7e;color:#fff;border:none}
.cpy{background:#222;color:#fff;border:1px solid #555}
#msg{text-align:center;font-size:.8rem;min-height:20px;margin-bottom:8px;font-weight:bold}
#wipe{display:none;position:absolute;inset:0;background:rgba(10,0,2,.97);border-radius:6px;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;z-index:10}
#wipe h2{color:#ff1e42;font-size:1.3rem;margin-bottom:10px}
#wipe p{color:#fff;font-size:.8rem;margin-bottom:12px}
#tmr{font-size:1.8rem;font-weight:bold;color:#ff1e42}
</style>
</head>
<body>
<div class="box">
  <div id="wipe">
    <h2>⚠️ INTRUDER DETECTED ⚠️</h2>
    <p>3 FAILED ATTEMPTS.<br>ALL DATA PERMANENTLY WIPED.</p>
    <div id="tmr">15s</div>
  </div>
  <div class="hdr">
    <h1>[ KALAH // SYSTEM ]</h1>
    <p>ENCRYPTED. DO NOT DISTURB. 🔒</p>
  </div>
  <div class="bar"><span>DEFENSE: ACTIVE</span><span id="shd">🛡️ 🛡️ 🛡️</span></div>
  <label>&gt; SECRET MESSAGE OR CODE:</label>
  <textarea id="in" rows="3" placeholder="Type message or paste code..."></textarea>
  <label>&gt; SECRET KEY (PASSWORD):</label>
  <input type="password" id="key" placeholder="Enter password...">
  <div class="row">
    <button class="enc" onclick="run('lock')">🔒 LOCK</button>
    <button class="dec" onclick="run('unlock')">🔓 UNLOCK</button>
  </div>
  <div id="msg"></div>
  <label>&gt; TERMINAL OUTPUT:</label>
  <textarea id="out" rows="3" readonly placeholder="Output appears here..."></textarea>
  <div class="row">
    <button class="cpy" onclick="cpy()">📋 COPY</button>
    <button class="wa" onclick="wa()">📲 WHATSAPP</button>
  </div>
</div>
<script>
let fails=0;
function upd(){document.getElementById('shd').innerText='🛡️ '.repeat(3-fails)+'❌ '.repeat(fails);}
function wipe(){
  document.getElementById('in').value='';
  document.getElementById('key').value='';
  document.getElementById('out').value='';
  document.getElementById('msg').innerText='';
  const w=document.getElementById('wipe'),t=document.getElementById('tmr');
  w.style.display='flex';let s=15;t.innerText=s+'s';
  const iv=setInterval(()=>{s--;t.innerText=s+'s';if(s<=0){clearInterval(iv);w.style.display='none';fails=0;upd();ntf('SYSTEM REBOOTED',0);}},1000);
}
function ntf(t,e){const m=document.getElementById('msg');m.style.color=e?'#ff3333':'#00ff66';m.innerText=t;setTimeout(()=>{if(m.innerText===t)m.innerText='';},3500);}
function xor(s,k){let r='';for(let i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return r;}
function run(m){
  const i=document.getElementById('in').value.trim(),k=document.getElementById('key').value,o=document.getElementById('out');
  if(!i)return ntf('! TYPE SOMETHING FIRST',1);
  if(!k)return ntf('! ENTER SECRET KEY',1);
  try{
    if(m==='lock'){
      o.value=btoa(xor(encodeURIComponent("KALAH::"+i),k));
      ntf('✓ LOCKED & READY',0);
    }else{
      const d=decodeURIComponent(xor(atob(i),k));
      if(!d.startsWith("KALAH::"))throw 1;
      o.value=d.slice(7);
      fails=0;upd();ntf('✓ UNLOCKED',0);
    }
  }catch(e){
    o.value='';
    if(m==='unlock'){
      fails++;upd();
      if(fails>=3)wipe();
      else{document.getElementById('key').value='';ntf(`⚠️ WRONG KEY! ${3-fails} LEFT`,1);}
    }else ntf('! ERROR',1);
  }
}
function cpy(){const o=document.getElementById('out');if(!o.value)return ntf('! NOTHING TO COPY',1);o.select();navigator.clipboard.writeText(o.value);ntf('✓ COPIED',0);}
function wa(){const o=document.getElementById('out').value;if(!o)return ntf('! LOCK FIRST',1);window.location.href="https://wa.me"+encodeURIComponent("🔒 *ENCRYPTED (KALAH)*\n\n"+o+"\n\n🔓 Unlock: "+window.location.href);}
</script>
</body>
</html>
