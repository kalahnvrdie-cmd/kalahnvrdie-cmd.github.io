<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message @ kalah</title>
    <style>
        body {
            background-color: #050a05;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            border: 1px solid #00ff41;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            border-radius: 5px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 1.3em;
            text-shadow: 0 0 8px #00ff41;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8em;
            color: #00b32d;
            border-bottom: 1px dashed #00ff41;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            background-color: #0a140a;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }
        textarea:focus, input:focus {
            box-shadow: 0 0 8px #00ff41;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            background-color: #0d260d;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:active {
            background-color: #00ff41;
            color: #050a05;
        }
        #status {
            text-align: center;
            font-size: 0.85em;
            color: #ffff00;
            margin-bottom: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Secret Message @ kalah ]</h2>
    <div class="subtitle">&gt; ENCRYPTED COMMUNICATION TERMINAL_</div>

    <label>&gt; ENTER MESSAGE OR CIPHER CODE:</label>
    <textarea id="inputText" rows="4" placeholder="Type your secret message or paste encrypted code here..."></textarea>

    <label>&gt; SECURITY KEY (PASSWORD):</label>
    <input type="password" id="secretKey" placeholder="Enter password...">

    <div class="btn-group">
        <button onclick="processData('encrypt')">🔒 ENCRYPT</button>
        <button onclick="processData('decrypt')">🔓 DECRYPT</button>
    </div>

    <div id="status"></div>

    <label>&gt; OUTPUT:</label>
    <textarea id="outputText" rows="4" readonly placeholder="Output will appear here..."></textarea>

    <div class="btn-group">
        <button onclick="copyOutput()">📋 COPY</button>
        <button onclick="sendWhatsApp()">📲 SEND VIA WA</button>
    </div>
</div>

<script>
    function showStatus(msg, isError = false) {
        const statusEl = document.getElementById('status');
        statusEl.style.color = isError ? '#ff3333' : '#00ff41';
        statusEl.innerText = msg;
        setTimeout(() => { statusEl.innerText = ''; }, 3000);
    }

    function xorCipher(text, key) {
        let result = '';
        for (let i = 0; i < text.length; i++) {
            result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
    }

    function processData(mode) {
        const text = document.getElementById('inputText').value.trim();
        const key = document.getElementById('secretKey').value;
        const outputEl = document.getElementById('outputText');

        if (!text) {
            showStatus('! Please enter a message or code first', true);
            return;
        }
        if (!key) {
            showStatus('! Please enter a Security Key', true);
            return;
        }

        try {
            if (mode === 'encrypt') {
                const utf8Bytes = encodeURIComponent(text);
                const xored = xorCipher(utf8Bytes, key);
                const encoded = btoa(xored);
                outputEl.value = encoded;
                showStatus('✓ Message Encrypted Successfully!');
            } else {
                const decodedBase64 = atob(text);
                const unxored = xorCipher(decodedBase64, key);
                const originalText = decodeURIComponent(unxored);
                outputEl.value = originalText;
                showStatus('✓ Message Decrypted Successfully!');
            }
        } catch (e) {
            showStatus('! Error: Wrong password or invalid code', true);
            outputEl.value = '';
        }
    }

    function copyOutput() {
        const outputEl = document.getElementById('outputText');
        if (!outputEl.value) {
            showStatus('! Nothing to copy', true);
            return;
        }
        outputEl.select();
        outputEl.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(outputEl.value).then(() => {
            showStatus('✓ Copied to Clipboard!');
        }).catch(() => {
            document.execCommand('copy');
            showStatus('✓ Copied!');
        });
    }

    function sendWhatsApp() {
        const out = document.getElementById('outputText').value;
        if (!out) {
            showStatus('! Encrypt a message first before sending', true);
            return;
        }
        const message = encodeURIComponent(out);
        window.open('https://whatsapp.com' + message, '_blank');
    }
</script>

</body>
</html>
